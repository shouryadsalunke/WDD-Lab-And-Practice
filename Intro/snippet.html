<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shourya Deepak Salunke - Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.7;
            color: hsl(169, 23%, 14%);
            background-color: #f4f7f6;
            padding: 40px 20px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid hsl(158, 43%, 88%);
        }
        header {
            margin-bottom: 40px;
        }
        h1 {
            color: hsl(160, 24%, 15%);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #687b75;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .contact-info {
            font-size: 0.9rem;
            color: #8a9a95;
        }
        .contact-info a {
            color: #558273;
            text-decoration: none;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
        section {
            margin-bottom: 40px;
        }
        h2 {
            color: #3d4f48;
            font-size: 1.3rem;
            font-weight: 600;
            border-bottom: 1px solid #e3ebe8;
            padding-bottom: 8px;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .item {
            margin-bottom: 20px;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }
        h3 {
            color: #3d4f48;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .date {
            font-size: 0.85rem;
            color: #8a9a95;
        }
        .details {
            font-size: 0.95rem;
            color: #5c6e68;
        }
        ul {
            padding-left: 20px;
            color: #5c6e68;
            font-size: 0.95rem;
        }
        li {
            margin-bottom: 6px;
        }
        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .badge {
            background: #edf4f1;
            color: #48645a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #e3ebe8;
            color: #a3b2ad;
            font-size: 0.8rem;
        }
        @media (max-width: 600px) {
            .item-header {
                flex-direction: column;
            }
            .container {
                padding: 25px;
            }
        }
    </style>
</html>
