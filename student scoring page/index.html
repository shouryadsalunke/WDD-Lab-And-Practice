<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grading System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Student Grading System</h1>
        <p>Understand the grading criteria</p>
    </header>
    <section class="image-section">
        <img src="Book.jpg" alt="Books">
    </section>
    <section class="grading-section">
        <h2 color: #1f4e79;>Grading Criteria</h2>
        <p>
            The following table shows the marks and their
            corresponding grades.
        </p>
        <table>
            <tr>
                <th>Marks</th>
                <th>Grade</th>
            </tr>
            <tr>
                <td>90 - 100</td>
                <td>A+</td>
            </tr>
            <tr>
                <td>80 - 89</td>
                <td>A</td>
            </tr>
            <tr>
                <td>70 - 79</td>
                <td>B+</td>
            </tr>
            <tr>
                <td>60 - 69</td>
                <td>B</td>
            </tr>
            <tr>
                <td>50 - 59</td>
                <td>C</td>
            </tr>
            <tr>
                <td>Below 50</td>
                <td>F</td>
            </tr>
        </table>
    </section>
    <div class="next-page">
        <a href="result.html">
            <button>
                Calculate Your Grade
            </button>
        </a>
    </div>
    <br>
    <footer>
        <p>
            Student Grading System © 2026
        </p>
    </footer>
</body>
</html>
