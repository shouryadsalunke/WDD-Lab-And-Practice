<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!--METHOD 1:-->
<body>
    <script>
        function disp() {
            document.getElementById("text").innerHTML = "Paragraph Changed";
        }
    </script>
    <h1>This is an example of Document write method !!</h1>
    <p id="text"></p>
        <button onclick="disp()">Current paragraph</button>
</body>
</html>
